[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-chaos-runner"
version = "0.3.0"
description = "Chaos engineering for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Carlos Orozco" }]
keywords = ["ai-agents", "chaos-engineering", "resilience", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "starlette>=0.38,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "twine>=7,<8",
  "types-PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Coroz2/agent-chaos"
Documentation = "https://github.com/Coroz2/agent-chaos#readme"
Repository = "https://github.com/Coroz2/agent-chaos"
Issues = "https://github.com/Coroz2/agent-chaos/issues"
Changelog = "https://github.com/Coroz2/agent-chaos/blob/main/CHANGELOG.md"

[project.scripts]
agentchaos = "agentchaos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentchaos"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentchaos"]
