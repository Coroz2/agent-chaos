schema_version: 1
name: api-429-no-recovery

dependency:
  type: http
  base_url: http://127.0.0.1:19106
  start:
    command: [python, fake_api.py, --port, "19106"]
    cwd: ..
    readiness:
      path: /health

workload:
  name: non-resilient-demo-agent
  command: [python, demo_agent.py]
  cwd: ..
  env:
    DEMO_MAX_ATTEMPTS: "1"
    DEMO_EXHAUSTED_EXIT_CODE: "0"
  proxy_url_env: CUSTOMER_API_URL

fault:
  type: http_rate_limit
  target:
    method: GET
    path: /customer/*
  trigger:
    occurrence: 2
  retry_after_seconds: 1

success:
  exit_code: 0

timeout_seconds: 10
