schema_version: 1
name: api-latency-recovery

dependency:
  type: http
  base_url: http://127.0.0.1:19102
  start:
    command: [python, fake_api.py, --port, "19102"]
    cwd: ..
    readiness:
      path: /health

workload:
  name: demo-agent
  command: [python, demo_agent.py]
  cwd: ..
  env:
    DEMO_TIMEOUT_MS: "150"
  proxy_url_env: CUSTOMER_API_URL

fault:
  type: http_latency
  target:
    method: GET
    path: /customer/*
  trigger:
    occurrence: 2
  latency_ms: 750

success:
  exit_code: 0

timeout_seconds: 10

