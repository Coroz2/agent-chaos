schema_version: 1
name: http-malformed-json-recovery

dependency:
  type: http
  base_url: http://127.0.0.1:19105
  start:
    command: [python, fake_api.py, --port, "19105"]
    cwd: ..
    readiness:
      path: /health

workload:
  name: demo-agent
  command: [python, demo_agent.py]
  cwd: ..
  proxy_url_env: CUSTOMER_API_URL

fault:
  type: http_malformed_json
  target:
    method: GET
    path: /customer/*
  trigger:
    occurrence: 2

success:
  exit_code: 0

timeout_seconds: 10
